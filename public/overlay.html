<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SitRight Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .overlay.visible {
      opacity: 1;
    }

    /* Colored inset shadow around the entire viewport edge */
    .overlay .glow {
      position: absolute;
      inset: 0;
      border-radius: 0;
      animation: pulse 2.5s ease-in-out infinite;
    }

    /* Warning = soft amber glow */
    .overlay.warning .glow {
      box-shadow: inset 0 0 80px 12px rgba(245, 158, 11, 0.25),
                  inset 0 0 160px 40px rgba(245, 158, 11, 0.08);
    }

    /* Bad = red glow, slightly stronger */
    .overlay.bad .glow {
      box-shadow: inset 0 0 90px 16px rgba(239, 68, 68, 0.30),
                  inset 0 0 180px 50px rgba(239, 68, 68, 0.10);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="overlay" class="overlay">
    <div class="glow"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const el = document.getElementById('overlay');

    ipcRenderer.on('overlay-update', (_event, status) => {
      // status: 'good' | 'warning' | 'bad' | 'hide'
      el.classList.remove('visible', 'warning', 'bad');

      if (status === 'warning' || status === 'bad') {
        el.classList.add('visible', status);
      }
    });
  </script>
</body>
</html>
